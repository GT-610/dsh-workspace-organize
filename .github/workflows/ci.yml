name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # The committed artifacts are the ones DSH installs, so the build must not
      # produce a diff: it fails here instead of silently drifting from the tree.
      - name: Build
        run: pnpm run build

      - name: Committed artifacts are current
        run: git diff --exit-code -- dist

      # A client bundle may only request the shell's baseline modules; a request
      # outside it fails at runtime, where the sidebar silently falls back to the
      # shipped browser. Nothing above reads the emitted artifact, so this is the
      # only step that can catch it.
      - name: Client bundle stays on the baseline
        run: pnpm run check:bundle
